<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Notion Agent — Live Demo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
    background: #0b0e14;
    color: #e6e6e6;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #999; margin-top: -8px; }
  #log {
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    min-height: 220px;
    max-height: 360px;
    overflow-y: auto;
    margin-bottom: 16px;
    background: #12151c;
  }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .you { color: #7dd3fc; }
  .agent { color: #86efac; }
  button {
    font-size: 1rem;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-right: 8px;
    user-select: none;
  }
  #talkBtn { background: #22c55e; color: #052e16; font-weight: 600; }
  #talkBtn.live { background: #ef4444; color: white; }
  #textForm { display: flex; gap: 8px; margin-top: 20px; }
  input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #12151c;
    color: #eee;
    font-size: 1rem;
  }
  #status { color: #999; font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>🎙️ Voice Notion Agent — Live Demo</h1>
  <p class="sub">Start a conversation and just talk — it answers as soon as you pause. Or type below.</p>

  <div id="log"></div>

  <button id="talkBtn">🎤 Start conversation</button>
  <div id="status"></div>

  <form id="textForm">
    <input type="text" id="textInput" placeholder="Save an idea: ..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

<script>
const sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
localStorage.setItem("session_id", sessionId);

const log = document.getElementById("log");
const statusEl = document.getElementById("status");
const talkBtn = document.getElementById("talkBtn");

function addMessage(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = (who === "you" ? "You: " : "Agent: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("textForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("you", text);
  statusEl.textContent = "Thinking...";

  const form = new FormData();
  form.append("message", text);
  form.append("session_id", sessionId);

  try {
    const res = await fetch("/api/chat", { method: "POST", body: form });
    const data = await res.json();
    addMessage("agent", data.reply);
  } catch (err) {
    addMessage("agent", "Something went wrong: " + err);
  } finally {
    statusEl.textContent = "";
  }
});

// ---- Live voice conversation (Gemini Live via /api/live) ----
// Mic audio streams up as 16 kHz PCM16; the agent's speech streams back as
// 24 kHz PCM16 and is played the instant it arrives.

// Runs on the audio thread: downsample the mic to 16 kHz (box-averaging the
// samples in each output slot) and post ~40 ms Int16 chunks.
const MIC_WORKLET = `
class MicProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.pos = 0; this.acc = 0; this.cnt = 0;
    this.out = new Int16Array(640); this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.cnt++;
      if (++this.pos >= this.ratio) {
        this.pos -= this.ratio;
        const s = Math.max(-1, Math.min(1, this.acc / this.cnt));
        this.acc = 0; this.cnt = 0;
        this.out[this.n++] = s * 0x7fff;
        if (this.n === this.out.length) {
          this.port.postMessage(this.out.buffer, [this.out.buffer]);
          this.out = new Int16Array(640); this.n = 0;
        }
      }
    }
    return true;
  }
}
registerProcessor("mic-processor", MicProcessor);`;

let ws = null, micStream = null, micCtx = null, playCtx = null;
let playHead = 0, playing = [];
let youBubble = null, agentBubble = null;

function setStatus(text) { statusEl.textContent = text; }

function appendTo(who, text) {
  // Transcripts arrive in fragments; grow the current bubble instead of
  // starting a new one per fragment.
  if (who === "you") {
    agentBubble = null;
    if (!youBubble) { addMessage("you", ""); youBubble = log.lastChild; }
    youBubble.textContent += text;
  } else {
    youBubble = null;
    if (!agentBubble) { addMessage("agent", ""); agentBubble = log.lastChild; }
    agentBubble.textContent += text;
  }
  log.scrollTop = log.scrollHeight;
}

function playPcm(arrayBuffer) {
  const pcm = new Int16Array(arrayBuffer);
  const buf = playCtx.createBuffer(1, pcm.length, 24000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  // Schedule back-to-back so chunks play gaplessly.
  playHead = Math.max(playHead, playCtx.currentTime + 0.02);
  src.start(playHead);
  playHead += buf.duration;
  playing.push(src);
  src.onended = () => { playing = playing.filter((s) => s !== src); };
}

function stopPlayback() {
  playing.forEach((s) => { try { s.stop(); } catch {} });
  playing = [];
  playHead = 0;
}

async function startConversation() {
  setStatus("Connecting...");
  try {
    // Echo cancellation keeps the agent from hearing (and interrupting) itself
    // through the speakers. Headphones work best.
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    setStatus("Microphone unavailable: " + err);
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  const workletUrl = URL.createObjectURL(new Blob([MIC_WORKLET], { type: "application/javascript" }));
  await micCtx.audioWorklet.addModule(workletUrl);
  const mic = new AudioWorkletNode(micCtx, "mic-processor");
  micCtx.createMediaStreamSource(micStream).connect(mic);

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/api/live`);
  ws.binaryType = "arraybuffer";
  mic.port.onmessage = (e) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data); };

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) { playPcm(e.data); return; }
    const event = JSON.parse(e.data);
    if (event.type === "ready") setStatus("Listening — just start talking.");
    else if (event.type === "user") appendTo("you", event.text);
    else if (event.type === "agent") appendTo("agent", event.text);
    else if (event.type === "tool") setStatus(`Working on it (${event.name.replace("_expert", "")})...`);
    else if (event.type === "interrupted") { stopPlayback(); agentBubble = null; }
    else if (event.type === "turn_complete") { agentBubble = null; youBubble = null; setStatus("Listening — just start talking."); }
    else if (event.type === "error") setStatus(event.text);
  };
  ws.onclose = () => { stopConversation(); };

  talkBtn.classList.add("live");
  talkBtn.textContent = "⏹ End conversation";
}

function stopConversation() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
  stopPlayback();
  if (micCtx) micCtx.close();
  if (playCtx) playCtx.close();
  micCtx = playCtx = null;
  youBubble = agentBubble = null;
  talkBtn.classList.remove("live");
  talkBtn.textContent = "🎤 Start conversation";
  if (!statusEl.textContent.startsWith("Microphone")) setStatus("");
}

talkBtn.addEventListener("click", () => (ws ? stopConversation() : startConversation()));
</script>
</body>
</html>
